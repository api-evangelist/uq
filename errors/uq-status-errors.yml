      observed: '2026-08-30'
  - status: 404
    condition: Document does not exist.
    body: HTML 404 page (~27,900 bytes), Content-Type text/html. No machine-readable error object.
    evidence:
      url: https://status.its.uq.edu.au/issues.json
      observed: '2026-08-30'
    consumer_note: >-
      A client must branch on Content-Type or on HTTP status, not on parsing the body — a JSON parse
      of a 404 will throw rather than yield an error object.
