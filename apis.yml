        url: lifecycle/uq-status-lifecycle.yml
      - type: Documentation
        url: https://status.its.uq.edu.au/
  - aid: uq:identity-federation
    name: UQ Identity Provider (SAML 2.0 / Shibboleth)
    x-operator: institution
    x-operator-evidence: >-
      UQ self-serves its own SAML EntityDescriptor from idp-prod.uq.edu.au (HTTP 200,
      application/xml, 4,423 bytes) and asserts shibmd:Scope uq.edu.au. The Australian Access
      Federation is the registry the entity is published through, not the operator of the service.
    description: >-
      UQ operates a SAML 2.0 Shibboleth identity provider, entityID
      urn:mace:federation.org.au:testfed:uq.edu.au, with SSO endpoints for the HTTP-Redirect,
      HTTP-POST and HTTP-POST-SimpleSign bindings. The entity is present in the live Australian
      Access Federation aggregate (360 entities) together with 27 UQ-operated service providers,
      giving UQ eduGAIN reach. Institution-operated by definition and machine-readable — this is the
      most substantial standards conformance UQ holds.
    baseURL: https://idp-prod.uq.edu.au
    humanURL: https://idp-prod.uq.edu.au/idp/shibboleth
    tags: [Identity, SAML, Shibboleth, Federation, eduGAIN, AAF]
    properties:
      - type: x-conformance
        url: conformance/uq-conformance.yml
      - type: Documentation
        url: https://idp-prod.uq.edu.au/idp/shibboleth
      - type: x-federation-metadata
        url: https://md.aaf.edu.au/aaf-metadata.xml
  - aid: uq:espace-api
    name: UQ eSpace REST API
    x-operator: institution
    x-operator-evidence: >-
      api.library.uq.edu.au is under uq.edu.au. The client that calls it, uqlibrary/fez-frontend, is
      UQ Library's own open-source code and names this host in its example.env; the operations
      (records, fez-authors, journals, vocabularies, orcid) are UQ eSpace's own resources, not a
      vendor product's.
    description: >-
      REST API behind UQ eSpace, the institutional repository for UQ research outputs and datasets,
      operated on UQ's own host by UQ Library. Not callable from outside the institution: every path
      probed on 2026-08-30 returned HTTP 403 "Request blocked" from CloudFront. No contract is saved
      here because none could be fetched or verified — the interface is legible only through UQ
      Library's own front-end source. UQ publishes no OpenAPI for it.
    baseURL: https://api.library.uq.edu.au
    humanURL: https://espace.library.uq.edu.au/view/UQ:10582
    tags: [Library, Institutional Repository, REST, Research, Datasets, ORCID, Bot Blocked]
    properties:
      - type: Documentation
        url: https://espace.library.uq.edu.au/view/UQ:10582
      - type: GitHub
        url: https://github.com/uqlibrary/fez-frontend
      - type: x-sitemap
        url: https://espace.library.uq.edu.au/sitemap/sitemap-index.xml
  - aid: uq:central-integration
    name: Central Integration Platform
    x-operator: institution
    x-operator-evidence: >-
      Named by UQ as its own integration platform, run by the UQ ITS Integration Services Team.
    description: >-
      UQ's internal API platform for transactional and business data, paired with the Data Hub
      synchronisation platform. Access is neither open nor self-service: consumers request access
      through the Integration Services Team and complete data governance approvals. No public
      endpoints, no published contract, no catalogue. The documentation page that the previous
      profile pointed at has moved and now returns HTTP 403 "Access denied" to anonymous clients, so
      that pointer has been removed rather than left in place as a claim.
    humanURL: https://its.uq.edu.au/
    tags: [Integration, Enterprise Data, Gated, Access Controlled, No Public Endpoints]
    properties:
      - type: Support
        url: https://its.uq.edu.au/
  - aid: uq:qld-open-data
    name: Queensland Government Open Data Portal (UQ organisation)
    x-operator: tenant
    x-operator-evidence: >-
      data.qld.gov.au is operated by the Queensland Government on CKAN. UQ is a publishing
      organisation on it under the slug university-of-queensland. UQ's data, the state's contract.
    description: >-
      UQ has no open data portal of its own. It publishes as an organisation on the Queensland
      Government's CKAN portal, where a live keyless package_search on 2026-08-30 returned a count of
      2 datasets. Recorded as a tenant relationship so the fact is legible without crediting UQ with
      CKAN's engineering. The CKAN Action API contract belongs in the portal operator's record, not
      here.
    humanURL: https://www.data.qld.gov.au/organization/university-of-queensland
    tags: [Open Data, CKAN, Tenant, Government Portal]
    properties:
      - type: APIReference
        url: https://www.data.qld.gov.au/api/3/action/package_search?fq=organization:university-of-queensland
  - aid: uq:library-discovery
    name: UQ Library discovery (Ex Libris Primo VE tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      search.library.uq.edu.au is UQ's own hostname but redirects to /discovery/search?vid=61UQ_INST:61UQ,
      the Ex Libris Primo VE tenant view code. Ex Libris runs the platform and wrote the contract; UQ
      supplies the collection and the branding. Host-based attribution would wrongly read this as
      institution-operated, which is exactly the failure this profile guards against.
    description: >-
      UQ's library discovery layer, a Primo VE tenancy on Ex Libris. No contract is saved under UQ —
      any Primo or Alma API definition belongs to Ex Libris and scores against Ex Libris.
    humanURL: https://search.library.uq.edu.au/
    tags: [Library, Discovery, Primo, Ex Libris, Tenant]
  - aid: uq:reading-lists
    name: UQ Reading Lists (Talis Aspire tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      uq.rl.talis.com is an institution-specific subdomain on Talis's own platform — the textbook
      tenant shape. Live HTTP 200 on 2026-08-30.
    description: >-
      UQ course reading lists hosted on Talis Aspire. Recorded as a tenant relationship; the Talis
      Aspire APIs are Talis's contract, not UQ's.
    humanURL: https://uq.rl.talis.com/
    tags: [Library, Reading Lists, Talis Aspire, Tenant]
