apis:
  - aid: uq:status-api
    name: UQ Status API
    x-operator: institution
    x-operator-evidence: >-
      status.its.uq.edu.au is under uq.edu.au, the institution's own registrable domain; UQ ITS runs
      the deployment and the content is UQ's own service inventory. The response format is that of
      cState 5.3, an open-source status-page generator UQ self-hosts — a platform choice, not an
      outsourced service.
    description: >-
      Keyless read-only JSON, RSS and SVG feeds describing the operational state of 678 University of
      Queensland systems across 43 service categories, plus every published incident. All five
      endpoints returned HTTP 200 to an anonymous GET on 2026-08-30. This is the only openly callable
      interface the institution operates.
    baseURL: https://status.its.uq.edu.au
    humanURL: https://status.its.uq.edu.au/
    tags:
    - Status
    - JSON
    - RSS
    - Keyless
    tags_raw:
    - Status
    - Operations
    - JSON
    - RSS
    - Keyless
    properties:
      - type: OpenAPI
        url: openapi/uq-status-openapi.yml
      - type: x-openapi-original
        url: openapi/_original/uq-status-openapi.yml
      - type: x-json-schema
        url: json-schema/uq-status-index-schema.json
      - type: x-examples
        url: examples/uq-status-index-example.json
      - type: Authentication
        url: authentication/uq-status-authentication.yml
      - type: x-errors
        url: errors/uq-status-errors.yml
      - type: x-rules
        url: rules/uq-status-rules.yml
