x-coverage:
  state: covered
  reason: covered
  generated: '2026-08-30'
  method: probed
  detail: >-
    Three institution-operated machine-readable surfaces were found, fetched and verified: the UQ
    Status API (keyless JSON/RSS/SVG, 678 systems), UQ's self-served SAML 2.0 Shibboleth
    EntityDescriptor, and the UQ eSpace REST API on UQ's own host. Coverage is nonetheless bounded by
    three real access barriers on UQ's side, all recorded below rather than reported as absence:
    api.library.uq.edu.au answers every path with a CloudFront "Request blocked" 403;
    programs-courses.uq.edu.au answers GET with 405 and x-amzn-waf-action captcha; data.uq.edu.au
    301-redirects into uq.sharepoint.com behind Microsoft Entra sign-in and its Central Integration
    Platform page now returns 403 Access denied. Two prior claims were corrected. The OAI-PMH
    endpoint the previous description asserted could not be reproduced — /oai.php, /oai2,
    /oai2.php and /oai/request all return the eSpace SPA shell, not an OAI-PMH response, and the
    re3data record making the claim still describes the retired Fez/Fedora stack. The
    DeveloperPortal pointer at data.uq.edu.au was removed: UQ operates no developer portal.
    Unofficial third-party UQ course scrapers on GitHub were found and deliberately not credited —
    they are neither on an institution domain nor institution-endorsed.
  evidence:
    - url: https://status.its.uq.edu.au/index.json
      status: 200
    - url: https://status.its.uq.edu.au/issues/index.json
      status: 200
    - url: https://status.its.uq.edu.au/index.xml
      status: 200
    - url: https://idp-prod.uq.edu.au/idp/shibboleth
      status: 200
    - url: https://md.aaf.edu.au/aaf-metadata.xml
      status: 200
    - url: https://espace.library.uq.edu.au/sitemap/sitemap-index.xml
      status: 200
    - url: https://www.data.qld.gov.au/api/3/action/package_search?fq=organization:university-of-queensland
      status: 200
    - url: https://api.library.uq.edu.au/records/types
      status: 403
      note: CloudFront "Request blocked" — WAF, not authentication. Live host, unreadable from outside.
    - url: https://programs-courses.uq.edu.au/
      status: 405
      note: 'awselb/2.0 with x-amzn-waf-action: captcha. Course catalog exists; machine access refused.'
    - url: https://data.uq.edu.au/access-and-share-data/central-integration-platform
      status: 403
      note: Access denied — the previous profile's documentation pointer, now dead. Removed.
    - url: https://espace.library.uq.edu.au/oai.php?verb=Identify
      status: 403
      note: Returns the eSpace SPA shell. The asserted OAI-PMH endpoint could not be reproduced.
    - url: https://www.uq.edu.au/.well-known/security.txt
      status: 404
    - url: https://www.uq.edu.au/llms.txt
      status: 404
