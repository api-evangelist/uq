aid: uq
name: University of Queensland
x-type: university
x-category: Public Research University
description: >-
  The University of Queensland (UQ) is a public research university in Brisbane, Australia, a member
  of the Group of Eight and of Universitas 21. Like nearly every institution of its kind, UQ is a
  federation of buyers rather than an API producer, and its programmable footprint has to be
  described honestly: UQ operates no developer portal, publishes no API terms, and offers no
  self-service registration for any interface. What it does operate, verified live on 2026-08-30, is
  three genuinely institution-run machine-readable surfaces. First, a keyless status API at
  status.its.uq.edu.au serving JSON, RSS and SVG covering 678 systems across 43 service categories.
  Second, a SAML 2.0 Shibboleth identity provider that self-serves its own EntityDescriptor at
  idp-prod.uq.edu.au and is registered in the Australian Access Federation alongside 27 UQ-operated
  service providers. Third, the UQ eSpace repository API on UQ's own host api.library.uq.edu.au,
  built and run by UQ Library's own engineering team in the open on GitHub, but blocked to outside
  clients by a CloudFront WAF. UQ's institutional data platforms — the Central Integration Platform
  and Data Hub — are real but entirely gated behind an access-request process. Its discovery layer
  (Ex Libris Primo), reading lists (Talis Aspire) and open-data publishing (the Queensland Government
  CKAN portal) are tenancies on platforms other parties operate, and are recorded here as tenant
  relationships rather than as UQ contracts.
